<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002b49">
<title>Düzeltici Faaliyet Portalı</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#173b55}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f9;visibility:hidden}
#instantLogin{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#f4f6f9}
.login{width:min(430px,100%);background:#fff;border:1px solid #e1e9ef;border-radius:18px;padding:26px 22px;box-shadow:0 12px 38px rgba(0,43,73,.12)}
.brand{background:#fff;border:1px solid #d6e0e8;border-radius:10px;padding:13px;margin-bottom:18px;text-align:center}
.brand img{display:block;max-width:100%;width:300px;max-height:70px;object-fit:contain;margin:auto}
h1{font-size:18px;text-align:center;margin:0 0 8px;color:#002b49}p{text-align:center;color:#71808c;font-size:13px;margin:0 0 15px}
input{width:100%;height:54px;border:1.5px solid #004d80;border-radius:10px;padding:0 14px;text-align:center;font-size:16px;font-weight:700;color:#002b49;outline:none}
button{width:100%;height:50px;border:0;border-radius:10px;background:#002b49;color:#fff;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
.status{display:none;margin-top:12px;padding:10px 12px;border-radius:9px;background:#eef7fb;color:#0b5f97;text-align:center;font-size:12px;font-weight:700}.status.show{display:block}.status.err{background:#fff0ef;color:#a6322b}

.loginTransition{
  position:fixed;inset:0;z-index:30;display:none;place-items:center;
  background:rgba(244,248,251,.98);padding:18px
}
.loginTransition.show{display:grid}
.transitionCard{
  width:min(440px,calc(100vw - 28px));min-height:300px;background:#fff;
  border:1px solid #dfe8ef;border-radius:22px;padding:30px 24px;
  box-shadow:0 24px 60px rgba(0,43,73,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center
}
.transitionOrbit{position:relative;width:158px;height:158px;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;inset:10px;border:1.5px solid rgba(11,95,151,.16)}
.r1{animation:spin 5s linear infinite}.r2{inset:25px;border-style:dashed;border-color:rgba(11,95,151,.30);animation:spinReverse 6.5s linear infinite}
.transitionCore{
  width:92px;height:92px;border-radius:28px;background:linear-gradient(180deg,#0f6ea9,#084d7a);
  display:grid;place-items:center;box-shadow:0 14px 28px rgba(11,95,151,.26);animation:pulse 1.7s ease-in-out infinite
}
.transitionCore svg{width:58px;height:58px}
.loginTransition .dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#0b6aa1;box-shadow:0 4px 10px rgba(11,95,151,.22)}
.loginTransition .d1{top:7px;left:50%;margin-left:-5px;animation:float 2.2s ease-in-out infinite}
.loginTransition .d2{right:11px;top:42px;animation:float 2.2s ease-in-out .4s infinite}
.loginTransition .d3{right:28px;bottom:16px;animation:float 2.2s ease-in-out .8s infinite}
.loginTransition .d4{left:17px;bottom:34px;animation:float 2.2s ease-in-out 1.2s infinite}
.transitionTitle{margin-top:14px;font-size:20px;font-weight:800;color:#0b5f97}
.transitionSub{margin-top:6px;font-size:13px;color:#71879a}
.transitionProgress{width:min(290px,100%);height:8px;border-radius:999px;background:#e6eef4;overflow:hidden;margin-top:20px}
.transitionProgress span{display:block;width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,#0b5f97,#2a91c8,#0b5f97);animation:slide 1.45s ease-in-out infinite}
.transitionDots{display:flex;gap:7px;margin-top:13px}.transitionDots i{width:7px;height:7px;border-radius:50%;background:#0b5f97;opacity:.25;animation:dotPulse 1.2s ease-in-out infinite}.transitionDots i:nth-child(2){animation-delay:.15s}.transitionDots i:nth-child(3){animation-delay:.3s}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes pulse{50%{transform:translateY(-2px) scale(1.03)}}@keyframes float{0%,100%{transform:scale(.85);opacity:.45}50%{transform:scale(1.1);opacity:1}}@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}@keyframes dotPulse{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}

</style>
</head>
<body>
<iframe id="frame" title="Düzeltici Faaliyet Portalı" allow="camera; clipboard-read; clipboard-write"></iframe>
<section id="instantLogin">
  <form class="login" id="loginForm">
    <div class="brand"><img src="https://lh3.googleusercontent.com/d/1ZJjPfKE8uAmYkeDD-67gKwH3WQfJ_tXW" alt="TUI BLUE Palm Garden"></div>
    <h1>Düzeltici Faaliyet Portalı Personel Girişi</h1>
    <p>Eğitim Portalı şifrenizi giriniz.</p>
    <input id="pw" type="password" placeholder="ŞİFRENİZ" autocomplete="current-password" autocapitalize="characters" spellcheck="false" required>
    <button id="loginBtn" type="submit">Giriş Yap</button>
    <div id="status" class="status"></div>
  </form>
</section>

<section id="loginTransition" class="loginTransition" aria-hidden="true">
  <div class="transitionCard">
    <div class="transitionOrbit">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span>
      <div class="transitionCore">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 7 49 14v13c0 12-7.1 22.1-17 27-9.9-4.9-17-15-17-27V14l17-7Z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="2.4"/>
          <path d="m23 32 6 6 12-13" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="transitionTitle">Giriş doğrulanıyor...</div>
    <div class="transitionSub">Düzeltici Faaliyet Portalı hazırlanıyor.</div>
    <div class="transitionProgress"><span></span></div>
    <div class="transitionDots"><i></i><i></i><i></i></div>
  </div>
</section>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbxv5I18idU7u_JheqIrwpIBUGcrNJ5C4WdsFNBDA2nkGS7-2hKDTAQMBBFVAzv91Bjz/exec';
const frame=document.getElementById('frame'),form=document.getElementById('loginForm'),pw=document.getElementById('pw'),statusBox=document.getElementById('status'),btn=document.getElementById('loginBtn'),transition=document.getElementById('loginTransition');
let frameReady=false,pendingPassword='';
frame.src=APP_URL+'?embedded=1';
frame.addEventListener('load',()=>{frameReady=true;if(pendingPassword)sendLogin(pendingPassword)});
function setStatus(msg,err){statusBox.textContent=msg;statusBox.className='status show'+(err?' err':'')}
function sendLogin(password){if(!frameReady){pendingPassword=password;setStatus('Giriş hazırlanıyor...',false);return}pendingPassword='';frame.contentWindow.postMessage({type:'DF_LOGIN_PASSWORD',password},'*')}
form.addEventListener('submit',e=>{e.preventDefault();const p=pw.value.toLocaleUpperCase('tr-TR').trim();if(!p)return;btn.disabled=true;statusBox.className='status';transition.classList.add('show');transition.setAttribute('aria-hidden','false');sendLogin(p)});
window.addEventListener('message',e=>{
  if(e.source!==frame.contentWindow)return;
  const d=e.data||{};
  if(d.type==='DF_LOGIN_OK'){transition.querySelector('.transitionTitle').textContent='Giriş başarılı';transition.querySelector('.transitionSub').textContent='Portal açılıyor...';setTimeout(()=>{document.getElementById('instantLogin').style.display='none';transition.classList.remove('show');transition.setAttribute('aria-hidden','true');frame.style.visibility='visible'},450)}
  if(d.type==='DF_LOGIN_ERROR'){transition.classList.remove('show');transition.setAttribute('aria-hidden','true');btn.disabled=false;setStatus(d.message||'Giriş başarısız.',true);pw.focus();pw.select()}
});
</script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002b49">
  <title>Düzeltici Faaliyet Portalı</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif}
    #appFrame{display:block;width:100%;height:100dvh;border:0;background:#fff}
    #loading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:rgba(244,248,251,.97);transition:opacity .25s ease,visibility .25s ease}
    #loading.hide{opacity:0;visibility:hidden;pointer-events:none}
    .loaderCard{width:min(470px,calc(100vw - 28px));min-height:270px;background:linear-gradient(180deg,#fff 0%,#f8fbfd 100%);border-radius:22px;box-shadow:0 24px 60px rgba(0,26,44,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 26px 24px;text-align:center;border:1px solid #dfe7ee;overflow:hidden;position:relative}
    .loaderCard:before{content:"";position:absolute;inset:auto -15% -40% -15%;height:140px;background:radial-gradient(circle at center,rgba(11,95,151,.12),rgba(11,95,151,0) 70%)}
    .safetyLoader{position:relative;width:152px;height:152px;display:grid;place-items:center;margin-bottom:8px}
    .safetyRing,.safetyRing2{position:absolute;border-radius:50%;inset:10px;border:1.5px solid rgba(11,95,151,.12)}
    .safetyRing{animation:spin 5.5s linear infinite}.safetyRing2{inset:24px;border-style:dashed;border-color:rgba(11,95,151,.22);animation:spinR 7s linear infinite}
    .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:linear-gradient(180deg,#2b84be,#0b5f97);box-shadow:0 4px 10px rgba(11,95,151,.25);animation:float 2.3s ease-in-out infinite}
    .d1{top:8px;left:50%;margin-left:-6px}.d2{right:16px;top:38px;animation-delay:.35s}.d3{right:20px;bottom:28px;animation-delay:.7s}.d4{left:20px;bottom:28px;animation-delay:1.05s}.d5{left:16px;top:38px;animation-delay:1.4s}
    .core{position:relative;z-index:2;width:94px;height:94px;border-radius:28px;background:linear-gradient(180deg,#0f6ea9,#084d7a);display:grid;place-items:center;box-shadow:0 14px 28px rgba(11,95,151,.26);animation:pulse 1.8s ease-in-out infinite}
    .core:after{content:"";position:absolute;inset:-8px;border-radius:34px;border:1px solid rgba(11,95,151,.16)}
    .icon{width:62px;height:62px}.shield{fill:#fff;opacity:.15}.helmet{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.check{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 18;animation:draw 1.7s ease-in-out infinite}
    .badge{position:absolute;z-index:3;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;color:#0b5f97;box-shadow:0 8px 18px rgba(0,26,44,.12);border:1px solid rgba(11,95,151,.12)}
    .b1{top:20px;right:8px}.b2{bottom:16px;right:14px}.b3{bottom:20px;left:8px}.badge svg{width:17px;height:17px}
    .txt{margin-top:14px;font-size:19px;font-weight:700;color:#0b5f97;position:relative;z-index:1}.sub{margin-top:6px;font-size:13px;color:#6a7d8c;position:relative;z-index:1}
    .progress{position:relative;z-index:1;width:min(280px,100%);height:8px;border-radius:999px;background:#e7eff5;overflow:hidden;margin-top:18px}.progress span{display:block;width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,#0b5f97,#2a91c8,#0b5f97);animation:slide 1.6s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes float{0%,100%{transform:scale(.85);opacity:.45}50%{transform:scale(1.08);opacity:1}}@keyframes pulse{50%{transform:translateY(-2px) scale(1.03)}}@keyframes draw{0%,15%{stroke-dashoffset:18;opacity:.35}35%,75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.55}}@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
    @media(max-width:800px){.loaderCard{width:min(400px,calc(100vw - 26px));min-height:250px;padding:24px 18px 22px}.safetyLoader{width:136px;height:136px}.core{width:84px;height:84px}.icon{width:56px;height:56px}.txt{font-size:16px}.sub{font-size:12px}}
  </style>
</head>
<body>
  <div id="loading">
    <div class="loaderCard">
      <div class="safetyLoader" aria-hidden="true">
        <div class="safetyRing"></div><div class="safetyRing2"></div>
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span><span class="dot d5"></span>
        <div class="core"><svg class="icon" viewBox="0 0 64 64"><path class="shield" d="M32 5l19 8v12c0 14-7.8 25.3-19 31-11.2-5.7-19-17-19-31V13z"/><path class="helmet" d="M18 29c0-8 6.1-14 14-14s14 6 14 14v2H18zm6 2v5m16-5v5M22 36h20m-17 0c0 5.2-3.3 9.2-7.5 10.5M39 46.5c4.2-1.3 7.5-5.3 7.5-10.5"/><path class="check" d="M24 33l5 5 11-11"/></svg></div>
        <div class="badge b1"><svg viewBox="0 0 24 24"><path d="M12 3l8.5 15H3.5L12 3zm0 5.2v4.8m0 3.6h.01" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
        <div class="badge b2"><svg viewBox="0 0 24 24"><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></div>
        <div class="badge b3"><svg viewBox="0 0 24 24"><path d="M5 13h14M12 6v14" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></div>
      </div>
      <div class="txt">Düzeltici Faaliyet Portalı hazırlanıyor...</div>
      <div class="sub">TUI BLUE Palm Garden dijital çalışma alanı açılıyor.</div>
      <div class="progress"><span></span></div>
    </div>
  </div>

  <iframe id="appFrame" title="Düzeltici Faaliyet Portalı" allow="camera; microphone; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbxv5I18idU7u_JheqIrwpIBUGcrNJ5C4WdsFNBDA2nkGS7-2hKDTAQMBBFVAzv91Bjz/exec';
    const frame=document.getElementById('appFrame');
    const loading=document.getElementById('loading');
    const p=new URLSearchParams(location.search);
    p.set('embedded','1');
    frame.src=APP_URL+'?'+p.toString();

    function hideLoading(){loading.classList.add('hide')}
    frame.addEventListener('load',()=>setTimeout(hideLoading,350));
    window.addEventListener('message',e=>{
      const d=e.data||{};
      if(d.type==='TBPG_PORTAL_READY'||d.portal==='DF') hideLoading();
    });
    setTimeout(hideLoading,12000);
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063653">
  <meta name="description" content="CaseUp - Düzeltici Faaliyet Portalı">
  <title>CaseUp | Düzeltici Faaliyet Portalı</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f2f7fa}
    body{display:grid;place-items:center}
    .wrap{text-align:center;padding:28px;color:#173b50}
    .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#063653,#087e98);color:#fff;font-size:28px;font-weight:800;box-shadow:0 16px 38px rgba(6,54,83,.20)}
    h1{margin:0;font-size:24px}
    p{margin:8px 0 0;color:#718692;font-size:13px}
    .bar{width:210px;height:7px;margin:22px auto 0;border-radius:999px;background:#dfeaf0;overflow:hidden}
    .bar span{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#0878a7,#11a8a0,#0878a7);animation:move 1.25s ease-in-out infinite}
    .link{display:inline-block;margin-top:18px;color:#0878a7;font-size:12px;text-decoration:none}
    .slogan{margin-top:18px;font-size:11px;color:#97a6af}
    @keyframes move{from{transform:translateX(-120%)}to{transform:translateX(350%)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">C</div>
    <h1>CaseUp</h1>
    <p>Düzeltici Faaliyet Portalına yönlendiriliyorsunuz...</p>
    <div class="bar"><span></span></div>
    <a id="manualLink" class="link" href="#">Otomatik açılmazsa buraya tıklayın</a>
    <div class="slogan">Her çözülen bildirim süreçleri bir adım yukarı taşır.</div>
  </div>

  <script>
    const CASEUP_APP_URL = 'https://script.google.com/macros/s/AKfycbxv5I18idU7u_JheqIrwpIBUGcrNJ5C4WdsFNBDA2nkGS7-2hKDTAQMBBFVAzv91Bjz/exec';

    function targetUrl(){
      try{
        const incoming = new URLSearchParams(window.location.search);
        incoming.delete('embedded'); // iframe kullanılmıyor
        const qs = incoming.toString();
        return CASEUP_APP_URL + (qs ? (CASEUP_APP_URL.includes('?') ? '&' : '?') + qs : '');
      }catch(e){
        return CASEUP_APP_URL;
      }
    }

    const target = targetUrl();
    document.getElementById('manualLink').href = target;

    // GitHub Pages URL'sini tarayıcı geçmişinde bırakmadan Apps Script'e geç.
    setTimeout(() => {
      window.location.replace(target);
    }, 350);
  </script>
</body>
</html>
